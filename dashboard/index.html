<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Clicks dashboard | AskColin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--teal:#0A8F76;--deep:#187C66;--mint:#B7DFD7;--pale:#E3FBF9;--ink:#1F1F1F;--muted:#5b6470;--coral:#FF8B66}
body{margin:0;background:var(--pale);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif}
.wrap{max-width:920px;margin:0 auto;padding:24px 16px 60px}
h1{font-size:28px;font-weight:800;margin:0 0 4px}
h1 span{color:var(--teal)}
.sub{color:var(--muted);margin:0 0 20px;font-size:15px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:20px}
input,select,button{font:inherit;padding:9px 12px;border-radius:10px;border:1.5px solid var(--mint);background:#fff}
input{flex:1 1 200px;min-width:0}
button{background:var(--teal);color:#fff;border-color:var(--teal);cursor:pointer;font-weight:700}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:8px}
.card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 4px 14px rgba(10,143,118,.08)}
.card b{display:block;font-size:32px;font-weight:800;line-height:1.05;color:var(--deep)}
.card span{color:var(--muted);font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.group{font-size:13px;font-weight:800;color:var(--teal);text-transform:uppercase;letter-spacing:.06em;margin:22px 0 8px}
h2{font-size:20px;font-weight:800;margin:26px 0 8px}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 4px 14px rgba(10,143,118,.06)}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid rgba(10,143,118,.12);font-size:14px;word-break:break-word}
th{background:rgba(10,143,118,.08);font-weight:700}
td.n{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;color:var(--deep);white-space:nowrap}
.bars{display:flex;align-items:flex-end;gap:3px;height:120px;background:#fff;border-radius:12px;padding:10px;box-shadow:0 4px 14px rgba(10,143,118,.06)}
.bar{flex:1;background:var(--teal);border-radius:4px 4px 0 0;min-height:2px;position:relative;opacity:.85}
.bar:hover{background:var(--coral);opacity:1}
.bar i{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted);white-space:nowrap;display:none;font-style:normal}
.bar:hover i{display:block}
.err{background:#fff3f0;border:1px solid var(--coral);padding:12px;border-radius:10px}
.note{color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <h1>ask<span>colin</span> clicks dashboard</h1>
  <p class="sub">What visitors actually do on askcolin.uk: governor deck, staff training, the health check, downloads and calls booked. These are clicks, not people. Page views are in Cloudflare; search impressions in Search Console.</p>
  <div class="row">
    <input id="key" type="password" placeholder="Dashboard key" autocomplete="off">
    <select id="days"><option value="7">Last 7 days</option><option value="30" selected>Last 30 days</option><option value="90">Last 90 days</option></select>
    <button id="go">Load</button>
    <span class="note" id="status"></span>
  </div>
  <div id="out"></div>
</div>
<script>
(function(){
  var keyEl=document.getElementById('key'),daysEl=document.getElementById('days'),out=document.getElementById('out'),st=document.getElementById('status');
  try{ keyEl.value=localStorage.getItem('askcolinTrackKey')||''; }catch(e){}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function get(list,name){var r=(list||[]).find(function(x){return x[0]===name;});return r?r[1]:0;}
  function sumStart(list,prefix){return (list||[]).filter(function(x){return x[0].indexOf(prefix)===0;}).reduce(function(a,x){return a+x[1];},0);}
  function card(n,label){return '<div class="card"><b>'+n+'</b><span>'+label+'</span></div>';}
  function table(title,rows,label){
    if(!rows||!rows.length) return '<h2>'+title+'</h2><p class="note">Nothing yet.</p>';
    return '<h2>'+title+'</h2><table><tr><th>'+label+'</th><th style="text-align:right">Clicks</th></tr>'+rows.map(function(r){return '<tr><td>'+esc(r[0])+'</td><td class="n">'+r[1]+'</td></tr>';}).join('')+'</table>';
  }
  function load(){
    var key=keyEl.value.trim(); if(!key){st.textContent='Enter the key.';return;}
    try{ localStorage.setItem('askcolinTrackKey',key);}catch(e){}
    st.textContent='Loading…';
    fetch('/api/clicks?key='+encodeURIComponent(key)+'&days='+daysEl.value,{cache:'no-store'}).then(function(r){
      if(r.status===401) throw new Error('Wrong key.');
      if(!r.ok) return r.text().then(function(t){ throw new Error('Server error '+r.status+' — '+t); });
      return r.json();
    }).then(function(d){
      st.textContent='';
      var bt=d.byType||{};
      var max=Math.max.apply(null,d.days.map(function(x){return x.total;}).concat([1]));
      var bars=d.days.map(function(x){return '<div class="bar" style="height:'+Math.max(2,Math.round(x.total/max*100))+'%"><i>'+x.date.slice(5)+': '+x.total+'</i></div>';}).join('');
      var b=d.briefing,t=d.training,c=d.check;
      out.innerHTML=
        '<div class="cards">'+card(d.total,'All clicks')+card(get(d.cta,'book a call'),'Book-a-call clicks')+card(bt.download||0,'Downloads')+card((bt.email||0)+(bt.phone||0),'Email & phone clicks')+'</div>'+
        '<div class="group">Governor deck</div><div class="cards">'+card(get(b,'opened'),'Opened')+card(get(b,'finished'),'Reached the end')+card(get(b,'questions sent'),'Questions sent')+card(get(b,'shared'),'Shared')+'</div>'+
        '<div class="group">Staff training</div><div class="cards">'+card(get(t,'opened'),'Opened')+card(sumStart(t,'started:'),'Modules started')+card(sumStart(t,'finished:'),'Modules finished')+card(get(t,'questions sent'),'Questions sent')+'</div>'+
        '<div class="group">AI policy health check</div><div class="cards">'+card(get(c,'started'),'Started')+card(sumStart(c,'completed'),'Completed')+card(get(c,'lead sent'),'Leads (sent results)')+card(get(d.cta,'question sent'),'Ask-Colin questions')+'</div>'+
        '<h2>Clicks per day</h2><div class="bars">'+bars+'</div>'+
        table('Governor deck: where people got to',b,'Step')+
        table('Staff training: modules',t,'Step')+
        table('Health check',c,'Step')+
        table('Downloads',d.download,'File')+
        table('Calls to action',d.cta,'What')+
        table('Pricing clicks',d.pricing,'Link')+
        table('Pages where the clicking happens',d.topPages,'Page');
    }).catch(function(e){ st.textContent=''; out.innerHTML='<div class="err">'+esc(e.message)+'</div>'; });
  }
  document.getElementById('go').onclick=load;
  keyEl.addEventListener('keydown',function(e){ if(e.key==='Enter') load(); });
  if(keyEl.value) load();
})();
</script>
</body>
</html>
